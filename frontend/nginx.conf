# 프론트엔드 nginx 설정 (컨테이너 내부).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: 새로고침/딥링크도 동작하도록 없는 경로는 index.html로 폴백.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 리버스 프록시: 브라우저의 /api/* 요청을 백엔드(backend:8000)로 넘긴다.
    # proxy_pass 끝의 '/' 가 앞의 /api/ 를 떼어준다. 예) /api/auth/me → /auth/me
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 채팅 스트리밍(토큰 단위 chunked 응답)이 버퍼링으로 끊기지 않게.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
